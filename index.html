er-radius:8px;background:#4a8aee}.toolbar{display:flex;flex-wrap:wrap;gap:11px;margin-bottom:21px}.field,select,textarea,input{border:1px solid #dce4ed;border-radius:9px;padding:11px 12px;background:#fff;color:#243a53;outline:none;font-size:13px;min-width:0}.field:focus,select:focus,textarea:focus,input:focus{border-color:#75a5fa;box-shadow:0 0 0 3px #e7f0ff}.toolbar input{flex:1;min-width:190px}.toolbar select{min-width:155px}.cards-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.provider-card{padding:22px}.provider-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.provider-logo{width:47px;height:47px;border-radius:12px;background:#eaf3ff;display:grid;place-items:center;font-size:24px}.provider-card h3{margin:0 0 5px}.provider-card .meta{font-size:11px;color:#8b99aa}.provider-card p{font-size:12px;line-height:1.7;color:#75869b;min-height:57px}.provider-info{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eef1f6;padding-top:15px;margin-bottom:16px;font-size:12px}.stars{color:#dd981e;font-weight:800}.provider-card .btn{width:100%}.complaint-list{display:grid;gap:13px}.complaint-card{padding:20px}.complaint-title{display:flex;justify-content:space-between;align-items:start;gap:15px}.complaint-card h3{margin:8px 0}.complaint-card p{font-size:12px;color:#7d8ca0;line-height:1.6}.complaint-meta{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:#8a98a8;margin:12px 0}.complaint-actions{display:flex;gap:8px;flex-wrap:wrap}.form-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,.85fr);gap:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.form-group{display:grid;gap:8px}.form-group.full{grid-column:1/-1}.form-group label{font-size:12px;font-weight:800}.required{color:#dd4b4b}.form-group input,.form-group select,.form-group textarea{width:100%}.form-group textarea{min-height:118px;resize:vertical}.form-note{font-size:11px;color:#9aa5b4}.tip{background:#edf5ff;border-radius:10px;padding:17px;font-size:12px;color:#42658d;line-height:1.8}.tip h3{margin-bottom:8px;color:#264c79}.form-actions{margin-top:20px;display:flex;gap:10px}.empty{text-align:center;padding:45px 15px;color:#8795a7}.empty .symbol{font-size:42px;margin-bottom:12px}.empty h3{color:#344861}.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.detail-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f6;padding:13px 0;font-size:12px}.detail-line span:first-child{color:#8b99a9}.response-box{background:#f1f7ff;padding:15px;border-radius:10px;font-size:13px;line-height:1.6}.evidence{max-width:100%;max-height:240px;border-radius:10px;object-fit:contain;border:1px solid var(--line);margin-top:10px}.timeline{display:flex;flex-direction:column;gap:13px;margin-top:17px}.timeline-item{border-left:2px solid #8bb4fa;padding-left:15px;font-size:12px}.timeline-item small{display:block;color:#94a1b0;margin-top:4px}.ratings{display:flex;gap:5px}.ratings label{cursor:pointer;font-size:25px;color:#d7dde7}.ratings input{display:none}.ratings label.selected{color:#e6a12a}.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini-card{background:#f6f9fe;padding:16px;border-radius:9px}.mini-card b{display:block;font-size:22px}.mini-card span{font-size:11px;color:#8c9aad}.mobile-menu{display:none}.small{font-size:11px;color:#8c9aaa}.muted{color:#8594a7}.separator{border:0;border-top:1px solid var(--line);margin:22px 0}#toast{position:fixed;right:25px;bottom:25px;background:#183a59;color:#fff;padding:14px 20px;border-radius:9px;box-shadow:0 10px 30px #1235;z-index:60;display:none;font-size:13px}.action-row{display:flex;gap:9px;flex-wrap:wrap}.notice{font-size:12px;padding:13px 15px;background:#fff7e8;color:#95652d;border-radius:9px;margin-bottom:20px}@media(max-width:1100px){.cards-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-templa <div class="app"><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-icon">✦</span><span>Resolve<span class="accent">Local</span><small>COMMUNITY SERVICE HUB</small></span></a><div class="side-label">WORKSPACE</div><nav id="nav"><button data-page="dashboard" class="active">▦ <span>Overview</span></button><button data-page="providers">⌕ <span>Find Providers</span></button><button data-page="complaints">☷ <span>My Complaints</span></button><button data-page="new">＋ <span>File a Complaint</span></button><button data-page="analytics">▥ <span>Insights & Analytics</span></button><button data-page="provider">◈ <span>Provider Workspace</span></button></nav><div class="sidebar-bottom"><div class="help-card"><b>Need assistance?</b><p>Track a complaint or contact your service provider directly.</p><button class="link-button" data-page="new">Report an issue →</button></div><small>CA1 • CSE326 | Frontend demo</small></div></aside>
<div class="main-area"><header class="topbar"><button id="menuToggle" class="mobile-menu" aria-label="Toggle navigation">☰</button><div class="breadcrumb">Community / <b id="breadcrumb">Overview</b></div><div class="top-actions"><span class="demo-tag">● Demo environment</span><label class="profile"><span class="avatar">R</span><span><b id="currentUserLabel">Resident</b><small>Local community member</small></span></label></div></header><main id="content"></main><footer>ResolveLocal • A community service transparency prototype • Data stored in this browser</footer></div></div>
<div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const STORE='resolvelocal_ca1_v1';
const providers=[{id:1,name:'BrightSpark Electricals',category:'Electrical',icon:'⚡',area:'Central District',desc:'Certified electricians for home wiring, fixtures and electrical maintenance.',rating:4.7},{id:2,name:'AquaFix Plumbing',category:'Plumbing',icon:'💧',area:'North Zone',desc:'Leak repairs, water supply maintenance and emergency plumbing services.',rating:4.5},{id:3,name:'CleanCity Waste Services',category:'Sanitation',icon:'♻️',area:'All Zones',desc:'Waste collection, street cleaning and neighborhood sanitation support.',rating:4.2},{id:4,name:'GreenLine Maintenance',category:'Maintenance',icon:'🛠️',area:'East District',desc:'Building upkeep, common-area repairs and preventive maintenance.',rating:4.6},{id:5,name:'NetWave Broadband',category:'Internet',icon:'🌐',area:'Central & West',desc:'Home broadband connectivity, router setup and technical support.',rating:4.1},{id:6,name:'SafeStreet Lighting',category:'Public Utilities',icon:'💡',area:'All Zones',desc:'Street lighting, outdoor illumination and public lighting repairs.',rating:4.4}];
const demo=[{id:'CMP-1001',name:'Aarav Sharma',email:'aarav@example.com',providerId:2,category:'Plumbing',title:'Recurring water leakage in main pipeline',description:'Water is leaking near the main entrance. It has happened repeatedly and needs a permanent fix.',location:'North Zone, Block B',priority:'High',status:'In Progress',date:'2026-10-21T10:00:00.000Z',response:'Technician assigned. Inspection is scheduled.',history:[{status:'Pending',note:'Complaint submitted',date:'2026-10-21T10:00:00.000Z'},{status:'In Progress',note:'Technician assigned. Inspection is scheduled.',date:'2026-10-22T09:00:00.000Z'}],rating:0},{id:'CMP-1002',name:'Meera Patel',email:'meera@example.com',providerId:3,category:'Sanitation',title:'Missed waste collection for three days',description:'Waste collection has not happened on our street for three consecutive days.',location:'Central District, Lane 4',priority:'Medium',status:'Pending',date:'2026-10-23T08:00:00.000Z',response:'',history:[{status:'Pending',note:'Complaint submitted',date:'2026-10-23T08:00:00.000Z'}],rating:0},{id:'CMP-1003',name:'Riya Kapoor',email:'riya@example.com',providerId:1,category:'Electrical',title:'Frequent power fluctuation',description:'Lights flicker every evening and need checking.',location:'East District',priority:'High',status:'Resolved',date:'2026-10-18T08:00:00.000Z',response:'Loose connection repaired and voltage checked.',history:[{status:'Pending',note:'Complaint submitted',date:'2026-10-18T08:00:00.000Z'},{status:'Resolved',note:'Loose connection repaired and voltage checked.',date:'2026-10-20T12:00:00.000Z'}],rating:5}];
let state=load(),page='dashboard',filterStatus='All',filterCategory='All',searchTerm='',providerFilter='All',providerSearch='',selectedComplaint=null,selectedRating=0,providerWorkspaceId=1;
function load(){try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&Array.isArray(v.complaints))return v;}catch(e){}return {complaints:structuredClone(demo),user:{name:'Resident',email:''}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){toast('Browser storage is full. Try a smaller image.');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function provider(id){return providers.find(p=>p.id===Number(id))||{name:'Unknown provider',category:'Other',icon:'◈'}}
function date(s){return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function badge(s){return `<span class="badge ${s==='Pending'?'pending':s==='In Progress'?'progress':s==='Resolved'?'resolved':'rejected'}">${esc(s)}</span>`}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',3200)}
function nav(p){page=p;selectedComplaint=null;searchTerm='';filterStatus='All';filterCategory='All';document.querySelector('.sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function head(k,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function stats(){const c=state.complaints;return [{label:'Total Complaints',v:c.length,icon:'☷',hint:'All submitted reports'},{label:'Pending Review',v:c.filter(x=>x.status==='Pending').length,icon:'◷',hint:'Awaiting provider action'},{label:'In Progress',v:c.filter(x=>x.status==='In Progress').length,icon:'↻',hint:'Currently being addressed'},{label:'Resolved',v:c.filter(x=>x.status==='Resolved').length,icon:'✓',hint:'Successfully completed'}]}
function statsHTML(){return `<div class="stats">${stats().map(s=>`<div class="stat"><div class="iconbox">${s.icon}</div><div class="value">${s.v}</div><div class="label">${s.label}</div><div class="hint">${s.hint}</div></div>`).join('')}</div>`}
function complaintRows(items){return `<div class="table-wrap"><table><thead><tr><th>Complaint</th><th>Provider</th><th>Submitted</th><th>Status</th><th></th></tr></thead><tbody>${items.map(c=>`<tr><td><b>${esc(c.id)}</b><br><span class="small">${esc(c.title)}</span></td><td>${esc(provider(c.providerId).name)}</td><td>${date(c.date)}</td><td>${badge(c.status)}</td><td><button class="text-link" data-detail="${esc(c.id)}">View →</button></td></tr>`).join('')}</tbody></table></div>`}
function breakdown(items,field){const entries=field==='category'?providers.map(p=>p.category):['Pending','In Progress','Resolved','Rejected'];const unique=[...new Set(entries)];return unique.map(cat=>{const n=items.filter(c=>field==='category'?c.category===cat:c.status===cat).length;return `<div class="bar-row"><div class="bar-label"><span>${esc(cat)}</span><b>${n}</b></div><div class="track"><div class="fill" style="width:${items.length?n/items.length*100:0}%"></div></div></div>`}).join('')}
function dashboard(){const recent=[...state.complaints].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);return `${head('YOUR COMMUNITY DASHBOARD','A better neighborhood starts here.','Discover trusted providers, report service issues, and follow every step toward resolution.',`<button class="btn" data-page="new">＋ Report an Issue</button>`)}<div class="hero"><div><h2>Making local services more accountable.</h2><p>Your voice matters. Raise a concern, stay informed, and help build a more responsive community.</p><button class="btn" data-page="providers">Explore service providers →</button></div><div class="hero-art">◎</div></div>${statsHTML()}<div class="grid-two"><section class="panel"><div class="panel-head"><h2>Recent Complaints</h2><button class="text-link" data-page="complaints">View all →</button></div>${recent.length?complaintRows(recent):empty('No complaints yet','Submit your first complaint to get started.')}</section><section class="panel"><div class="panel-head"><h2>Complaint Status</h2><span class="small">Live overview</span></div>${breakdown(state.complaints,'status')}<hr class="separator"><h3>Quick Actions</h3><div class="action-row"><button class="btn ghost" data-page="new">＋ New Complaint</button><button class="btn outline" data-page="analytics">View Insights</button></div></section></div>`}
function empty(t,d){return `<div class="empty"><div class="symbol">⌕</div><h3>${t}</h3><p>${d}</p></div>`}
function providerCard(p){const complaints=state.complaints.filter(c=>c.providerId===p.id);const ratings=complaints.filter(c=>c.rating>0).map(c=>c.rating);const rating=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):p.rating.toFixed(1);return `<article class="provider-card"><div class="provider-top"><div class="provider-logo">${p.icon}</div><div><h3>${esc(p.name)}</h3><span class="meta">${esc(p.category)} • ${esc(p.area)}</span></div></div><p>${esc(p.desc)}</p><div class="provider-info"><span class="stars">★ ${rating} <span class="small">${ratings.length?'community reviews':'sample rating'}</span></span><span>${complaints.length} reports</span></div><button class="btn outline" data-file-provider="${p.id}">Report an Issue →</button></article>`}
function providersPage(){let ps=providers.filter(p=>(providerFilter==='All'||p.category===providerFilter)&&`${p.name} ${p.category} ${p.area}`.toLowerCase().includes(providerSearch.toLowerCase()));return `${head('SERVICE DIRECTORY','Find local service providers','Browse services in your area and report concerns directly to the responsible provider.',`<button class="btn" data-page="new">＋ File Complaint</button>`)}<div class="toolbar"><input id="providerSearch" placeholder="Search by provider, service or area..." value="${esc(providerSearch)}"><select id="providerFilter"><option>All</option>${[...new Set(providers.map(p=>p.category))].map(x=>`<option ${providerFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="cards-grid" id="providerResults">${ps.map(providerCard).join('')||empty('No providers found','Try another search or category.')}</div>`}
function complaintsPage(){let cs=state.complaints.filter(c=>(filterStatus==='All'||c.status===filterStatus)&&(filterCategory==='All'||c.category===filterCategory)&&`${c.id} ${c.title} ${c.description} ${c.name} ${provider(c.providerId).name}`.toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>new Date(b.date)-new Date(a.date));return `${head('COMPLAINT TRACKER','Complaint Management','Search, review and track the progress of submitted service complaints.',`<button class="btn" data-page="new">＋ New Complaint</button>`)}<div class="toolbar"><input id="complaintSearch" placeholder="Search complaint ID, issue or provider..." value="${esc(searchTerm)}"><select id="statusFilter">${['All','Pending','In Progress','Resolved','Rejected'].map(s=>`<option ${filterStatus===s?'selected':''}>${s}</option>`).join('')}</select><select id="categoryFilter">${['All',...new Set(providers.map(p=>p.category))].map(s=>`<option ${filterCategory===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="complaintResults" class="complaint-list">${cs.map(c=>`<article class="complaint-card"><div class="complaint-title"><div><span class="small">${esc(c.id)} • ${date(c.date)}</span><h3>${esc(c.title)}</h3></div>${badge(c.status)}</div><p>${esc(c.description)}</p><div class="complaint-meta"><span>◈ ${esc(provider(c.providerId).name)}</span><span>⌖ ${esc(c.location)}</span><span>Priority: ${esc(c.priority)}</span></div><div class="complaint-actions"><button class="btn outline" data-detail="${esc(c.id)}">View Details & Updates →</button></div></article>`).join('')||empty('No matching complaints','Try changing your search or filters.')}</div>`}
function newPage(prefill){return `${head('REPORT A SERVICE ISSUE','File a New Complaint','Provide clear details so the service provider can understand and address your concern.') }<div class="form-layout"><section class="panel"><form id="complaintForm"><div class="form-grid"><div class="form-group"><label for="name">Your Name <span class="required">*</span></label><input id="name" name="name" maxlength="80" required placeholder="Enter full name" value="${esc(state.user.name==='Resident'?'':state.user.name)}"></div><div class="form-group"><label for="email">Email Address <span class="required">*</span></label><input id="email" name="email" type="email" maxlength="120" required placeholder="you@example.com" value="${esc(state.user.email)}"></div><div class="form-group"><label for="providerId">Service Provider <span class="required">*</span></label><select id="providerId" name="providerId" required><option value="">Select a provider</option>${providers.map(p=>`<option value="${p.id}" ${Number(prefill)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="form-group"><label for="category">Complaint Category <span class="required">*</span></label><select id="category" name="category" required><option value="">Select category</option>${[...new Set(providers.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="form-group full"><label for="title">Complaint Title <span class="required">*</span></label><input id="title" name="title" maxlength="120" minlength="5" required placeholder="A short summary of the problem"></div><div class="form-group full"><label for="description">Describe the Issue <span class="required">*</span></label><textarea id="description" name="description" minlength="15" maxlength="2000" required placeholder="What happened? When did it begin? Is it recurring?"></textarea></div><div class="form-group"><label for="location">Location / Area <span class="required">*</span></label><input id="location" name="location" maxlength="150" required placeholder="e.g. North Zone, Block B"></div><div class="form-group"><label for="priority">Priority Level <span class="required">*</span></label><select id="priority" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="form-group full"><label for="evidence">Supporting Evidence (optional)</label><input type="file" id="evidence" name="evidence" accept="image/png,image/jpeg,image/webp"><span class="form-note">JPG, PNG or WebP. Max 1 MB. Stored only in your browser.</span></div></div><div class="form-actions"><button class="btn" type="submit">Submit Complaint →</button><button class="btn outline" type="reset">Clear Form</button></div></form></section><aside><div class="panel"><h3>Before you submit</h3><div class="tip"><h3>Tips for a good complaint</h3>✓ Choose the correct provider and category.<br>✓ Describe the issue clearly and accurately.<br>✓ Include the location and relevant details.<br>✓ Add a photo if it helps explain the problem.</div><hr class="separator"><h3>What happens next?</h3><p class="sub">Your complaint starts as <b>Pending</b>. In the provider workspace, it can be marked <b>In Progress</b> and then <b>Resolved</b> with a response.</p></div></aside></div>`}
function analyticsPage(){const cs=state.complaints,resolved=cs.filter(c=>c.status==='Resolved').length,rate=cs.length?Math.round(resolved/cs.length*100):0,ratings=cs.filter(c=>c.rating>0),avg=ratings.length?(ratings.reduce((s,c)=>s+c.rating,0)/ratings.length).toFixed(1):'—';return `${head('COMMUNITY INTELLIGENCE','Insights & Analytics','Understand common service problems, provider responsiveness and resolution progress.',`<button class="btn outline" id="exportCsv">↓ Export CSV</button>`)}${statsHTML()}<div class="analytics-grid"><div class="panel"><div class="panel-head"><h2>Complaints by Category</h2></div>${breakdown(cs,'category')}</div><div class="panel"><div class="panel-head"><h2>Resolution Performance</h2></div><div class="mini-grid"><div class="mini-card"><b>${rate}%</b><span>Resolution rate</span></div><div class="mini-card"><b>${avg}${ratings.length?' / 5':''}</b><span>Community rating</span></div><div class="mini-card"><b>${cs.filter(c=>c.priority==='High').length}</b><span>High priority reports</span></div><div class="mini-card"><b>${providers.length}</b><span>Listed service providers</span></div></div><h3 style="margin-top:24px">Status Distribution</h3>${breakdown(cs,'status')}</div></div><section class="panel"><div class="panel-head"><h2>Provider Report Volume</h2></div>${providers.map(p=>{let n=cs.filter(c=>c.providerId===p.id).length;return `<div class="bar-row"><div class="bar-label"><span>${esc(p.name)}</span><b>${n}</b></div><div class="track"><div class="fill" style="width:${cs.length?n/cs.length*100:0}%"></div></div></div>`}).join('')}</section>`}
function providerPage(){const cs=state.complaints.filter(c=>c.providerId===providerWorkspaceId).sort((a,b)=>new Date(b.date)-new Date(a.date));return `${head('PROVIDER WORKSPACE','Manage Service Requests','Demonstration workspace: choose a provider to respond to complaints and update their status.')}<div class="notice">Demo mode: provider access is not authenticated. In production, only verified providers should be allowed to manage their own complaints.</div><div class="panel"><div class="toolbar" style="margin:0"><label for="workspaceProvider" style="font-size:12px;font-weight:800;align-self:center">Viewing provider:</label><select id="workspaceProvider">${providers.map(p=>`<option value="${p.id}" ${p.id===providerWorkspaceId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="panel"><div class="panel-head"><h2>Assigned Complaints (${cs.length})</h2></div>${cs.length?cs.map(c=>`<article class="complaint-card" style="margin-bottom:14px;box-shadow:none"><div class="complaint-title"><div><span class="small">${esc(c.id)} • ${date(c.date)}</span><h3>${esc(c.title)}</h3></div>${badge(c.status)}</div><p>${esc(c.description)}</p><p class="small">Reported by ${esc(c.name)} • ${esc(c.location)}</p><form class="responseForm" data-id="${esc(c.id)}"><div class="form-grid"><div class="form-group"><label>Status</label><select name="status">${['Pending','In Progress','Resolved','Rejected'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-group"><label>Provider Response / Update</label><input name="response" maxlength="500" required placeholder="Explain action taken or next steps" value="${esc(c.response)}"></div></div><div class="form-actions"><button class="btn" type="submit">Save Update</button><button class="btn outline" type="button" data-detail="${esc(c.id)}">View Full Complaint</button></div></form></article>`).join(''):empty('No assigned complaints','Select another provider or submit a new complaint.')}</div>`}
function detailPage(){const c=state.complaints.find(c=>c.id===selectedComplaint);if(!c)return complaintsPage();return `${head('COMPLAINT DETAILS',esc(c.title),`Reference ID: ${esc(c.id)}`,`<button class="btn outline" data-page="complaints">← Back to Complaints</button>`)}<div class="detail-grid"><section><div class="panel"><div class="panel-head"><h2>Issue Overview</h2>${badge(c.status)}</div><p class="sub">${esc(c.description)}</p>${c.evidence?`<p class="small">Attached evidence:</p><img class="evidence" alt="Complaint supporting evidence" src="${c.evidence}">`:''}<hr class="separator"><div class="detail-line"><span>Service Provider</span><b>${esc(provider(c.providerId).name)}</b></div><div class="detail-line"><span>Category</span><b>${esc(c.category)}</b></div><div class="detail-line"><span>Location</span><b>${esc(c.location)}</b></div><div class="detail-line"><span>Priority</span><b>${esc(c.priority)}</b></div><div class="detail-line"><span>Submitted by</span><b>${esc(c.name)}</b></div><div class="detail-line"><span>Submission Date</span><b>${date(c.date)}</b></div></div><div class="panel"><h2>Provider Response</h2>${c.response?`<div class="response-box">${esc(c.response)}</div>`:`<p class="sub">No response has been posted yet.</p>`}</div>${c.status==='Resolved'?`<div class="panel"><h2>Rate the Resolution</h2><p class="sub" style="margin-bottom:12px">How satisfied are you with this service response?</p><div class="ratings" id="ratings">${[1,2,3,4,5].map(i=>`<label data-rating="${i}" class="${i<=c.rating?'selected':''}" aria-label="${i} stars">★</label>`).join('')}</div><div class="form-actions"><button class="btn" id="saveRating">Save Rating</button></div></div>`:''}</section><aside><div class="panel"><h2>Status Timeline</h2><div class="timeline">${(c.history||[]).map(h=>`<div class="timeline-item"><b>${esc(h.status)}</b><p class="sub">${esc(h.note)}</p><small>${date(h.date)}</small></div>`).join('')}</div></div><div class="panel"><h3>Need another service?</h3><p class="sub" style="margin-bottom:14px">Browse providers or submit another issue.</p><button class="btn outline" data-page="providers">Browse Providers →</button></div></aside></div>`}
function render(){const names={dashboard:'Overview',providers:'Find Providers',complaints:'My Complaints',new:'File a Complaint',analytics:'Insights & Analytics',provider:'Provider Workspace',detail:'Complaint Details'};document.getElementById('breadcrumb').textContent=names[page];document.getElementById('currentUserLabel').textContent=state.user.name;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=({dashboard,providers:providersPage,complaints:complaintsPage,new:()=>newPage(window.prefillProvider),analytics:analyticsPage,provider:providerPage,detail:detailPage})[page]();if(page==='new'){const sel=document.getElementById('providerId');if(sel.value)document.getElementById('category').value=provider(sel.value).category;window.prefillProvider=null}}
function updateComplaintList(){const active=document.activeElement;const pos=active?.selectionStart;const id=active?.id;document.getElementById('content').innerHTML=complaintsPage();if(id){const e=document.getElementById(id);if(e){e.focus();if(e.setSelectionRange&&pos!==null)e.setSelectionRange(pos,pos)}}}
function updateProviders(){const active=document.activeElement;const pos=active?.selectionStart;const id=active?.id;document.getElementById('content').innerHTML=providersPage();if(id){const e=document.getElementById(id);if(e){e.focus();if(e.setSelectionRange&&pos!==null)e.setSelectionRange(pos,pos)}}}
function csv(){const columns=['id','name','email','provider','category','title','description','location','priority','status','date','response','rating'];const lines=[columns.join(','),...state.complaints.map(c=>columns.map(k=>{let v=k==='provider'?provider(c.providerId).name:c[k]??'';return '"'+String(v).replace(/"/g,'""')+'"'}).join(','))];const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resolvelocal-complaints.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){nav(b.dataset.page);return}const f=e.target.closest('[data-file-provider]');if(f){window.prefillProvider=Number(f.dataset.fileProvider);nav('new');return}const d=e.target.closest('[data-detail]');if(d){selectedComplaint=d.dataset.detail;page='detail';render();window.scrollTo(0,0);return}const r=e.target.closest('[data-rating]');if(r){selectedRating=Number(r.dataset.rating);document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.rating)<=selectedRating));return}if(e.target.id==='saveRating'){const c=state.complaints.find(x=>x.id===selectedComplaint);if(!selectedRating)return toast('Select a rating first.');c.rating=selectedRating;save();toast('Thank you for your rating!');render()}if(e.target.id==='exportCsv'){csv();toast('CSV exported successfully.')}if(e.target.id==='menuToggle')document.querySelector('.sidebar').classList.toggle('open')});
document.addEventListener('input',e=>{if(e.target.id==='providerSearch'){providerSearch=e.target.value;updateProviders()}if(e.target.id==='complaintSearch'){searchTerm=e.target.value;updateComplaintList()}});
document.addEventListener('change',e=>{if(e.target.id==='providerFilter'){providerFilter=e.target.value;updateProviders()}if(e.target.id==='statusFilter'){filterStatus=e.target.value;updateComplaintList()}if(e.target.id==='categoryFilter'){filterCategory=e.target.value;updateComplaintList()}if(e.target.id==='workspaceProvider'){providerWorkspaceId=Number(e.target.value);render()}if(e.target.id==='providerId'){document.getElementById('category').value=provider(e.target.value).category||''}});
document.addEventListener('submit',async e=>{if(e.target.id==='complaintForm'){e.preventDefault();const form=e.target,fd=new FormData(form),file=fd.get('evidence');let evidence='';if(file&&file.size){if(file.size>1024*1024)return toast('Evidence image must be 1 MB or smaller.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Please choose a JPG, PNG or WebP image.');evidence=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}const now=new Date().toISOString();const id='CMP-'+(Math.max(1000,...state.complaints.map(c=>Number(c.id.split('-')[1])||1000))+1);const c={id,name:String(fd.get('name')).trim(),email:String(fd.get('email')).trim(),providerId:Number(fd.get('providerId')),category:String(fd.get('category')),title:String(fd.get('title')).trim(),description:String(fd.get('description')).trim(),location:String(fd.get('location')).trim(),priority:String(fd.get('priority')),status:'Pending',date:now,response:'',evidence,history:[{status:'Pending',note:'Complaint submitted',date:now}],rating:0};if(!c.name||!c.email||!c.providerId||!c.category||!c.title||!c.description||!c.location)return toast('Please complete all required fields.');state.complaints.unshift(c);state.user={name:c.name,email:c.email};if(!save()){state.complaints.shift();return}selectedComplaint=id;page='detail';render();window.scrollTo(0,0);toast(`Complaint ${id} submitted successfully!`)}if(e.target.classList.contains('responseForm')){e.preventDefault();const c=state.complaints.find(x=>x.id===e.target.dataset.id);const fd=new FormData(e.target);const status=String(fd.get('status')),response=String(fd.get('response')).trim();if(!response)return toast('Please add a response.');c.status=status;c.response=response;c.history.push({status,note:response,date:new Date().toISOString()});save();render();toast('Complaint updated successfully!')}});
render();

</script></body></html>
